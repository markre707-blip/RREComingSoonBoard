# RRE Coming Soon Board - daily refresh
name: Refresh RRE board

on:
  schedule:
- cron: "45 15 * * *"
workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  SHEET_ID: "1bd17-1Hn9jYLmSxIDQl33nyrFTlrQb0lhGBqYIpZMzo"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download latest board data from Google Sheets
        run: curl -fsSL "https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv" -o data.csv
      - name: Build the page
        run: python3 build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
